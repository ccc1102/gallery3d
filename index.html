<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3Dリング・ギャラリー (手前側の画像が反応)</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            font-family: sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
            cursor: grab;
        }

        body:active { cursor: grabbing; }

        .stage {
            width: 200px;
            height: 260px;
            position: relative;
            transform-style: preserve-3d;
        }

        .carousel {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(-10deg) rotateY(0deg);
        }

        /* 外側の3D位置用ボックス */
        .card {
            position: absolute;
            width: 200px;
            height: 260px;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        /* 内側の見た目・拡大用ボックス */
        .card-inner {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #000;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 【重要】「手前側」（.is-front-side）にあるカードにホバーした時だけ1.5倍拡大 */
        .card.is-front-side:hover .card-inner {
            transform: scale(1.5);
        }

        .card.is-front-side:hover {
            z-index: 100;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
        }

        /* モーダル */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: default;
        }

        .modal.active { display: flex; }
        .modal img {
            max-width: 80vw;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            color: #9ca3af;
            font-size: 0.9rem;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="carousel" id="carousel">
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1015/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1018/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1025/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1039/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1043/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1050/600/800"></div></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <img id="modal-img" src="">
    </div>

    <div class="hint">🎠 手前側のカードならどれでもホバーで拡大 / クリックで拡大表示</div>

    <script>
        const carousel = document.getElementById('carousel');
        const cards = document.querySelectorAll('.card');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');

        const totalCards = cards.length;
        const angleStep = 360 / totalCards;
        const radius = 280;

        // 初期配置（それぞれの角度を記録）
        const baseAngles = [];
        cards.forEach((card, index) => {
            const angle = index * angleStep;
            baseAngles.push(angle);
            card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
        });

        let isDragging = false;
        let isHovered = false; // 手前側のカードにホバーしているかどうかのフラグ
        let isMoved = false;
        let startX = 0;
        let currentRotationY = 0;

        let currentSpeed = 0.2;
        const targetSpeed = 0.2;

        // 1. 手前側（正面を中心とした±90度＝180度の範囲）にあるカードを特定する関数
        function updateFrontSideCards() {
            cards.forEach((card, index) => {
                // リング全体の回転角度 + カード自体の初期角度
                let totalAngle = (currentRotationY + baseAngles[index]) % 360;
                if (totalAngle < 0) totalAngle += 360;

                // 0度（正面）からの差分（0〜180度）
                let diff = Math.abs(totalAngle);
                if (diff > 180) diff = 360 - diff;

                // 差分が90度以内（＝手前側の半円の中にある場合）
                if (diff <= 90) {
                    card.classList.add('is-front-side');
                } else {
                    card.classList.remove('is-front-side');
                }
            });
        }

        // 2. 自動回転（慣性ブレーキ処理）
        function animate() {
            // 手前側のカードにホバー中・ドラッグ中・モーダル表示中は回転停止
            const isStopping = isHovered || isDragging || modal.classList.contains('active');
            const target = isStopping ? 0 : targetSpeed;

            currentSpeed += (target - currentSpeed) * 0.08;

            if (Math.abs(currentSpeed) > 0.001) {
                currentRotationY += currentSpeed;
                carousel.style.transform = `rotateX(-10deg) rotateY(${currentRotationY}deg)`;
            }

            // 毎フレーム手前側のカード判定を更新
            updateFrontSideCards();

            requestAnimationFrame(animate);
        }
        animate();

        // 3. マウスホバー判定（.is-front-side が付いている手前のカードの上でのみ有効）
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                if (card.classList.contains('is-front-side')) {
                    isHovered = true;
                }
            });
            card.addEventListener('mouseleave', () => {
                isHovered = false;
            });
        });

        // 4. ドラッグ操作
        window.addEventListener('mousedown', (e) => {
            if (modal.classList.contains('active')) return;
            isDragging = true;
            isMoved = false;
            startX = e.clientX;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            if (Math.abs(deltaX) > 3) isMoved = true;

            currentRotationY += deltaX * 0.4;
            startX = e.clientX;
            carousel.style.transform = `rotateX(-10deg) rotateY(${currentRotationY}deg)`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // 5. クリックで拡大表示（手前側のカードのみモーダル表示）
        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (isMoved || !card.classList.contains('is-front-side')) return;
                modalImg.src = card.querySelector('img').src;
                modal.classList.add('active');
            });
        });

        modal.addEventListener('click', () => modal.classList.remove('active'));
    </script>
</body>
</html>

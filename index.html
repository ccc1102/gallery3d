<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Dリング・ギャラリー (スマホ画面サイズ最適化)</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #111827 0%, #030712 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            font-family: sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
            cursor: grab;
            touch-action: none;
        }

        body:active { cursor: grabbing; }

        /* --- 1. PC用のサイズ設定 --- */
        .stage {
            width: 200px;
            height: 260px;
            position: relative;
            transform-style: preserve-3d;
        }

        .carousel {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(-10deg) rotateY(0deg);
        }

        .card {
            position: absolute;
            width: 200px;
            height: 260px;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #000;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card.is-front-side:hover .card-inner {
            transform: scale(1.5);
        }

        .card.is-front-side:hover {
            z-index: 100;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
        }

        /* --- 2. スマホ（画面幅768px以下）用の調整 --- */
        @media (max-width: 768px) {
            .stage {
                width: 130px;
                height: 170px;
            }
            .card {
                width: 130px;
                height: 170px;
            }
            /* スマホでは拡大率を1.3倍程度に抑えてはみ出しを防止 */
            .card.is-front-side:hover .card-inner {
                transform: scale(1.3);
            }
        }

        /* モーダル */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: default;
        }

        .modal.active { display: flex; }
        .modal img {
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            color: #9ca3af;
            font-size: 0.85rem;
            letter-spacing: 1px;
            pointer-events: none;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div class="carousel" id="carousel">
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1015/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1018/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1025/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1039/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1043/600/800"></div></div>
            <div class="card"><div class="card-inner"><img src="https://picsum.photos/id/1050/600/800"></div></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <img id="modal-img" src="">
    </div>

    <div class="hint">📱 スワイプで回転 / タップで拡大表示</div>

    <script>
        const carousel = document.getElementById('carousel');
        const cards = document.querySelectorAll('.card');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');

        const totalCards = cards.length;
        const angleStep = 360 / totalCards;
        
        // 画面幅に応じて回転半径（radius）を動的に切り替える
        function getRadius() {
            return window.innerWidth <= 768 ? 170 : 280; // スマホなら170px、PCなら280px
        }

        const baseAngles = [];

        // 3D配置を設定する関数
        function setupCards() {
            const radius = getRadius();
            cards.forEach((card, index) => {
                const angle = index * angleStep;
                baseAngles[index] = angle;
                card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
            });
        }
        setupCards();

        // 画面サイズが変更されたら半径を自動計算しなおす
        window.addEventListener('resize', setupCards);

        let isDragging = false;
        let isHovered = false;
        let isMoved = false;
        let startX = 0;
        let currentRotationY = 0;

        let currentSpeed = 0.2;
        const targetSpeed = 0.2;

        function updateFrontSideCards() {
            cards.forEach((card, index) => {
                let totalAngle = (currentRotationY + baseAngles[index]) % 360;
                if (totalAngle < 0) totalAngle += 360;
                let diff = Math.abs(totalAngle);
                if (diff > 180) diff = 360 - diff;

                if (diff <= 90) {
                    card.classList.add('is-front-side');
                } else {
                    card.classList.remove('is-front-side');
                }
            });
        }

        function animate() {
            const isStopping = isHovered || isDragging || modal.classList.contains('active');
            const target = isStopping ? 0 : targetSpeed;

            currentSpeed += (target - currentSpeed) * 0.08;

            if (Math.abs(currentSpeed) > 0.001) {
                currentRotationY += currentSpeed;
                carousel.style.transform = `rotateX(-10deg) rotateY(${currentRotationY}deg)`;
            }

            updateFrontSideCards();
            requestAnimationFrame(animate);
        }
        animate();

        // 操作処理
        function startDrag(clientX) {
            if (modal.classList.contains('active')) return;
            isDragging = true;
            isMoved = false;
            startX = clientX;
        }

        function moveDrag(clientX) {
            if (!isDragging) return;
            const deltaX = clientX - startX;
            if (Math.abs(deltaX) > 3) isMoved = true;

            currentRotationY += deltaX * 0.4;
            startX = clientX;
            carousel.style.transform = `rotateX(-10deg) rotateY(${currentRotationY}deg)`;
        }

        function endDrag() {
            isDragging = false;
        }

        window.addEventListener('mousedown', (e) => startDrag(e.clientX));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
        window.addEventListener('mouseup', endDrag);

        window.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX), { passive: true });
        window.addEventListener('touchmove', (e) => moveDrag(e.touches[0].clientX), { passive: true });
        window.addEventListener('touchend', endDrag);

        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                if (card.classList.contains('is-front-side')) isHovered = true;
            });
            card.addEventListener('mouseleave', () => {
                isHovered = false;
            });

            card.addEventListener('click', () => {
                if (isMoved || !card.classList.contains('is-front-side')) return;
                modalImg.src = card.querySelector('img').src;
                modal.classList.add('active');
            });
        });

        modal.addEventListener('click', () => modal.classList.remove('active'));
    </script>
</body>
</html>
